# Render Blueprint：在控制台「New」→「Blueprint」导入此文件，或连接仓库后手动对照填写
# 文档：https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bingwu-server
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bingwu-my-monorepo/server build
    preDeployCommand: pnpm --filter @bingwu-my-monorepo/server exec prisma migrate deploy
    startCommand: pnpm --filter @bingwu-my-monorepo/server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # 在 Render 控制台补充为 Secret，勿提交到 Git：
      # DATABASE_URL、JWT_SECRET、CORS_ORIGINS 等
